<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>玩具大比拼 V1.0</title><style>*{box-sizing:border-box}body{margin:0;background:#101724;color:white;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}#scene{position:fixed;inset:0;touch-action:none}#top{position:fixed;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}#top>*{pointer-events:auto}.pill{background:#182437d9;border:1px solid #40506a;border-radius:14px;padding:9px 12px}button,select{font:inherit;border:0;border-radius:12px;padding:10px 12px;background:#27364c;color:white}button:active{transform:scale(.97)}button.active{background:#d18a26;color:#141b24}#bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom,8px) + 8px);left:8px;right:8px;background:#101a2ce8;border:1px solid #344258;border-radius:18px;padding:10px;display:grid;gap:9px}#tools,#actions{display:flex;gap:6px;overflow-x:auto}#tools button,#actions button{flex:1;white-space:nowrap;font-size:13px}#library{display:flex;gap:7px;overflow-x:auto;padding:3px 0}#library button{flex:0 0 auto;min-width:74px;display:grid;gap:3px;font-size:12px}#library .emoji{font-size:24px}.swatches{display:flex;gap:9px}.swatches button{width:27px;height:27px;border:2px solid #fff8;padding:0;border-radius:50%}.swatches button.sel{outline:3px solid #f8d26b}#hint{font-size:12px;color:#c5d1e0;min-height:18px}#power{width:100%}#status{font-size:12px;color:#e7c078}#loading{position:fixed;inset:0;background:#101724;display:grid;place-items:center;z-index:20;text-align:center;padding:30px}small{color:#aabbd0}</style></head><body><div id="loading">正在加载真实3D竞技场…<br><small>首次打开需要网络加载 Three.js</small></div><div id="scene"></div><div id="top"><div class="pill"><b>🧸 玩具大比拼</b><div id="status">自由沙盒 · 0个玩具</div></div><button class="pill" id="camera">📷 切换视角</button></div><div id="bottom"><div id="actions"><button id="sandbox" class="active">自由沙盒</button><button id="battle">圆圈淘汰</button><button id="reset">重置场地</button></div><div id="library"></div><div class="swatches" id="swatches"></div><div id="tools"><button data-tool="grab" class="active">✋ 抓取/摆放</button><button data-tool="push">👉 推动</button><button data-tool="launch">🚀 弹射</button><button data-tool="rotate">🔄 旋转</button></div><label style="font-size:12px">弹射力度 <span id="powerValue">65</span>% <input id="power" type="range" min="10" max="100" value="65"></label><div id="hint">选一个玩具放入场地；长按拖动玩具，或切换推动/弹射。</div></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const scene=new THREE.Scene();scene.background=new THREE.Color('#aab9c6');const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x647184,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-6,12,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;scene.add(sun);
const mat=(color,metalness=0,roughness=.48)=>new THREE.MeshStandardMaterial({color,metalness,roughness});const baseMat=mat('#4a5866',.45,.7);const arena=new THREE.Mesh(new THREE.CylinderGeometry(6.7,6.7,.3,96),baseMat);arena.position.y=-.16;arena.receiveShadow=true;scene.add(arena);const ring=new THREE.Mesh(new THREE.TorusGeometry(6.58,.105,12,120),mat('#e8aa37',.6,.3));ring.rotation.x=Math.PI/2;ring.position.y=.035;scene.add(ring);const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),mat('#d1d6db',0,.9));ground.rotation.x=-Math.PI/2;ground.position.y=-.5;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(13,22,0x718394,0x718394);grid.position.y=.006;grid.material.transparent=true;grid.material.opacity=.16;scene.add(grid);
const defs=[['🏎️','越野车','buggy'],['🚙','怪兽车','monster'],['🚗','小汽车','car'],['🚜','挖掘机','excavator'],['🚚','卡车','truck'],['🤖','机器人','robot'],['🦖','恐龙','dino'],['⚫','铁球','ball'],['🧱','积木','block'],['🦆','橡胶鸭','duck'],['🚁','直升机','heli'],['🚂','火车','train']];const colors=['#ed4245','#237be8','#ffcf32','#2ac678','#a95af0','#ff8c24','#f3f3f3','#20232c'];let selectedType='buggy',selectedColor=colors[0],tool='grab',mode='sandbox',angle=0,items=[],pointer=null,last=performance.now();const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function mesh(geo,material,x=0,y=0,z=0){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m}function box(w,h,d,m,x=0,y=0,z=0){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z)}function ball(r,m,x=0,y=0,z=0){return mesh(new THREE.SphereGeometry(r,20,16),m,x,y,z)}
function build(type,color){const group=new THREE.Group(),paint=mat(color,.25,.32),black=mat('#181b22',.05,.85),glass=mat('#364e60',.2,.16),metal=mat('#a7b2b9',.72,.25);let radius=.65,mass=1;function wheels(spread=0.42,front=.53,back=-.53,r=.24){for(const x of [-spread,spread])for(const z of [front,back]){const w=mesh(new THREE.CylinderGeometry(r,r,.17,20),black,x,r,z);w.rotation.z=Math.PI/2;group.add(w);const hub=mesh(new THREE.CylinderGeometry(r*.48,r*.48,.18,16),metal,x,r,z);hub.rotation.z=Math.PI/2;group.add(hub)}}
if(['buggy','monster','car','truck','excavator','train'].includes(type)){const large=type==='monster',long=type==='truck'||type==='train';group.add(box(long?1.15:.92,.32,long?1.7:1.15,paint,0,.42,0));group.add(box(.68,.36,.56,glass,0,.73,-.18));wheels(large?.53:.43,long?.72:.53,long?-.72:-.53,large?.38:.24);radius=large?.92:long?1:.72;mass=large?3:long?2.5:1.2;if(type==='excavator'){group.add(box(.75,.15,.25,metal,0,.9,-.28));const arm=box(.16,.15,.92,paint,.05,.99,.45);arm.rotation.x=-.4;group.add(arm);group.add(box(.56,.18,.22,metal,.05,.72,.96))}if(type==='buggy'){group.add(box(.7,.07,1.03,metal,0,.91,0));group.add(box(.07,.36,.07,metal,-.32,.77,-.43),box(.07,.36,.07,metal,.32,.77,-.43))}}
else if(type==='ball'){group.add(ball(.49,mat(color,.75,.2),0,.49,0));radius=.5;mass=3.5}else if(type==='block'){group.add(box(.85,.85,.85,paint,0,.43,0));radius=.58;mass=.8}else if(type==='robot'){group.add(box(.55,.65,.35,paint,0,.72,0),box(.4,.35,.36,metal,0,1.22,0));for(const x of [-.4,.4])group.add(box(.18,.55,.2,paint,x,.72,0));for(const x of [-.17,.17])group.add(box(.2,.4,.22,metal,x,.2,0));radius=.53;mass=1.4}else if(type==='dino'){group.add(ball(.48,paint,0,.57,0),ball(.27,paint,0,1.04,.38));group.add(box(.23,.55,.26,paint,-.27,.28,0),box(.23,.55,.26,paint,.27,.28,0));const tail=mesh(new THREE.ConeGeometry(.24,.95,10),paint,0,.53,-.73);tail.rotation.x=-Math.PI/2;group.add(tail);radius=.7;mass=1.6}else if(type==='duck'){group.add(ball(.48,paint,0,.49,0),ball(.27,paint,0,.93,.29),box(.28,.12,.3,mat('#ffb23a'),0,.88,.58));radius=.5;mass=.55}else if(type==='heli'){group.add(ball(.43,paint,0,.58,0),box(.16,.15,1.35,paint,0,.62,-.52),box(1.65,.05,.12,metal,0,1.11,0),box(.95,.08,.15,metal,0,.22,0));radius=.72;mass=1.2}return {group,radius,mass}}
function add(type=selectedType,color=selectedColor,x=(Math.random()-.5)*5,z=(Math.random()-.5)*5){const b=build(type,color);b.group.position.set(x,0,z);b.group.userData.obj=true;scene.add(b.group);items.push({...b,type,color,vx:0,vz:0,spin:0,dead:false});updateStatus();return items.at(-1)}function updateStatus(){document.getElementById('status').textContent=`${mode==='sandbox'?'自由沙盒':'圆圈淘汰'} · ${items.filter(x=>!x.dead).length}个玩具`}
function selectTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));document.getElementById('hint').textContent={grab:'拖动玩具可抓取摆放；空白处拖动可转动镜头',push:'从玩具上向目标方向滑动，松手推动',launch:'从玩具向后拉动蓄力，松手朝反方向弹射',rotate:'在玩具上水平拖动，改变朝向'}[t]}
const lib=document.getElementById('library');defs.forEach(([emoji,name,id])=>{const b=document.createElement('button');b.innerHTML=`<span class="emoji">${emoji}</span>${name}`;b.onclick=()=>{selectedType=id;lib.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');add(id,selectedColor)};if(id===selectedType)b.classList.add('active');lib.appendChild(b)});const swatches=document.getElementById('swatches');colors.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.title=c;b.onclick=()=>{selectedColor=c;swatches.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');if(pointer?.item){pointer.item.group.traverse(n=>{if(n.isMesh&&n.material.color&&n.material.metalness===.25)n.material.color.set(c)})}};if(c===selectedColor)b.classList.add('sel');swatches.appendChild(b)});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>selectTool(b.dataset.tool));document.getElementById('power').oninput=e=>document.getElementById('powerValue').textContent=e.target.value;document.getElementById('sandbox').onclick=()=>setMode('sandbox');document.getElementById('battle').onclick=()=>setMode('battle');function setMode(m){mode=m;document.getElementById('sandbox').classList.toggle('active',m==='sandbox');document.getElementById('battle').classList.toggle('active',m==='battle');items.forEach(x=>x.dead=false);updateStatus()}document.getElementById('reset').onclick=()=>{items.forEach(x=>scene.remove(x.group));items=[];add('buggy','#ed4245',-2,0);add('monster','#237be8',2,0);add('ball','#ffcf32',0,2);add('block','#26a65b',0,-2)};document.getElementById('camera').onclick=()=>{angle+=Math.PI/3;setCamera()};function setCamera(){camera.position.set(Math.sin(angle)*13,11,Math.cos(angle)*13);camera.lookAt(0,0,0)}setCamera();
function coords(e){const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);const v=new THREE.Vector3();ray.ray.intersectPlane(plane,v);return v}function pick(e){const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(items.filter(x=>!x.dead).map(x=>x.group),true);if(!hit.length)return null;let obj=hit[0].object;while(obj&&!obj.userData.obj)obj=obj.parent;return items.find(x=>x.group===obj)||null}
const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointer={item:pick(e),start:coords(e),prev:coords(e),sx:e.clientX,sy:e.clientY};if(pointer.item&&tool==='grab'){pointer.item.vx=pointer.item.vz=0}});canvas.addEventListener('pointermove',e=>{if(!pointer)return;e.preventDefault();const p=coords(e);if(pointer.item){if(tool==='grab'){const limit=5.85/Math.max(1,Math.hypot(p.x,p.z));pointer.item.group.position.set(p.x*Math.min(1,limit),.18,p.z*Math.min(1,limit))}else if(tool==='rotate'){pointer.item.group.rotation.y+=(e.clientX-pointer.sx)*.012;pointer.sx=e.clientX}}else{angle+=(e.clientX-pointer.sx)*.006;pointer.sx=e.clientX;setCamera()}pointer.prev=p});canvas.addEventListener('pointerup',e=>{if(!pointer)return;const p=coords(e);const it=pointer.item;if(it){if(tool==='grab'){it.group.position.y=0}else if(tool==='push'||tool==='launch'){const d=tool==='launch'?pointer.start.clone().sub(p):p.clone().sub(pointer.start);const len=Math.hypot(d.x,d.z);if(len>.12){const speed=Math.min(9,Math.max(.8,len*1.7))*Number(document.getElementById('power').value)/65;it.vx+=d.x/len*speed/Math.sqrt(it.mass);it.vz+=d.z/len*speed/Math.sqrt(it.mass)}}}pointer=null});canvas.addEventListener('pointercancel',()=>{pointer=null});
function simulate(dt){for(const a of items){if(a.dead||pointer?.item===a&&tool==='grab')continue;a.group.position.x+=a.vx*dt;a.group.position.z+=a.vz*dt;a.group.rotation.y+=a.spin*dt;const friction=Math.pow(.984,dt*60);a.vx*=friction;a.vz*=friction;a.spin*=Math.pow(.94,dt*60);const dist=Math.hypot(a.group.position.x,a.group.position.z);if(dist>6.5-a.radius*.35){if(mode==='battle'){a.dead=true;scene.remove(a.group);updateStatus()}else{const nx=a.group.position.x/dist,nz=a.group.position.z/dist;const vn=a.vx*nx+a.vz*nz;if(vn>0){a.vx-=1.55*vn*nx;a.vz-=1.55*vn*nz}a.group.position.x=nx*(6.5-a.radius*.35);a.group.position.z=nz*(6.5-a.radius*.35)}}}for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j];if(a.dead||b.dead)continue;let dx=b.group.position.x-a.group.position.x,dz=b.group.position.z-a.group.position.z,dist=Math.hypot(dx,dz)||.0001,min=a.radius+b.radius;if(dist>=min)continue;const nx=dx/dist,nz=dz/dist,over=min-dist,total=a.mass+b.mass;a.group.position.x-=nx*over*b.mass/total;a.group.position.z-=nz*over*b.mass/total;b.group.position.x+=nx*over*a.mass/total;b.group.position.z+=nz*over*a.mass/total;const rv=(b.vx-a.vx)*nx+(b.vz-a.vz)*nz;if(rv<0){const impulse=-(1+.48)*rv/(1/a.mass+1/b.mass);a.vx-=impulse*nx/a.mass;a.vz-=impulse*nz/a.mass;b.vx+=impulse*nx/b.mass;b.vz+=impulse*nz/b.mass;a.spin+=rv*.1;b.spin-=rv*.1}}}
function animate(t){const dt=Math.min(.033,(t-last)/1000||.016);last=t;simulate(dt);renderer.render(scene,camera);requestAnimationFrame(animate)}window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.getElementById('reset').click();document.getElementById('loading').remove();requestAnimationFrame(animate);
