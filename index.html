function updateCount(){const n=items.filter(a=>!a.dead&&!a.falling).length;$('count').textContent=`场上 ${n} 个玩具`;$('survivors').textContent=n}function refreshMatchHUD(){const t=Math.floor(matchSeconds);$('matchTime').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');$('koCount').textContent=koCount;updateCount()}function startTournament(){for(const a of items)disposeToy(a);items.length=0;mode='battle';changeMode('battle');matchActive=true;matchEnded=false;matchSeconds=0;koCount=0;matchTotal=12;matchSeed++;paused=false;$('pause').textContent='⏸ 暂停';autoBattle=true;$('auto').classList.add('active');$('auto').textContent='⚡ 自动混战：开启';for(let i=0;i<12;i++){selected=i%defs.length;selectedColor=colors[i%colors.length];const angle=i*Math.PI*2/12,rad=3.2+(i%3)*.65;const a=spawn(Math.cos(angle)*rad,Math.sin(angle)*rad);if(a){a.g.rotation.y=angle;a.vx=-Math.sin(angle)*(.3+i%3*.2);a.vz=Math.cos(angle)*(.3+i%3*.2)}}$('matchState').textContent='淘汰赛进行中';$('tournament').classList.add('active');$('status').textContent='🏁 12个玩具入场！最后留在圈内的玩具获胜';refreshMatchHUD()}$('tournament').onclick=startTournament;$('replay').onclick=startTournament;$('library').innerHTML=defs.map(([emoji,name],i)=>`<button data-index="${i}" class="${i===0?'active':''}"><span class="emoji">${emoji}</span>${name}</button>`).join('');$('library').onclick=e=>{const b=e.target.closest('[data-index]');if(!b)return;selected=+b.dataset.index;document.querySelectorAll('#library button').forEach(v=>v.classList.toggle('active',v===b));$('status').textContent=`已选择：${defs[selected][1]}，点击场地放置`};$('colors').innerHTML=colors.map((c,i)=>`<button data-color="${c}" style="background:${c}" class="${i===0?'active':''}" aria-label="颜色${i+1}"></button>`).join('');$('colors').onclick=e=>{const b=e.target.closest('[data-color]');if(!b)return;selectedColor=b.dataset.color;document.querySelectorAll('#colors button').forEach(v=>v.classList.toggle('active',v===b))};document.querySelectorAll('#tools button').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('#tools button').forEach(x=>x.classList.toggle('active',x===b))});$('power').oninput=e=>{$('pv').textContent=e.target.value+'%';power=+e.target.value};function changeMode(m){if(m==='sandbox'){matchActive=false;matchEnded=false;$('matchState').textContent='自由试玩';$('tournament').classList.remove('active')}mode=m;$('sandbox').classList.toggle('active',m==='sandbox');$('battle').classList.toggle('active',m==='battle');$('modeLabel').textContent=m==='sandbox'?'自由沙盒 · 精细玩具':'圆圈淘汰 · 最后冠军';$('status').textContent=m==='battle'?'把玩具撞出金色圆圈！':'自由摆放并推动玩具'}$('sandbox').onclick=()=>changeMode('sandbox');$('battle').onclick=()=>changeMode('battle');$('auto').onclick=()=>{autoBattle=!autoBattle;$('auto').classList.toggle('active',autoBattle);$('auto').textContent=autoBattle?'⚡ 自动混战：开启':'⚡ 自动混战：关闭';$('status').textContent=autoBattle?'玩具开始自动寻找对手并碰撞！':'自动混战已暂停'};$('speed').oninput=e=>{speedLevel=+e.target.value;$('sv').textContent=speedLevel+'档'};$('fill').onclick=()=>{let added=0;for(let i=0;i<12&&items.filter(a=>!a.dead).length<30;i++){selected=Math.floor(Math.random()*defs.length);selectedColor=colors[Math.floor(Math.random()*colors.length)];const ang=Math.random()*Math.PI*2,rad=1+Math.sqrt(Math.random())*5.7;spawn(Math.cos(ang)*rad,Math.sin(ang)*rad);added++}updateCount();$('status').textContent='🎲 新增 '+added+' 个玩具，最多30个'};$('clear').onclick=()=>{$('reset').click()};$('reset').onclick=()=>{for(const o of items)scene.remove(o.g);items.length=0;updateCount();$('status').textContent='场地已重置'};$('camera').onclick=()=>{orbitOn=false;$('orbit').classList.remove('active');cameraMode=(cameraMode+1)%3;setCamera()};$('collapse').onclick=()=>{$('panel').classList.toggle('collapsed');$('collapse').textContent=$('panel').classList.contains('collapsed')?'展开面板':'收起面板'};
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),-.32);function world(e){const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);const p=new THREE.Vector3();ray.ray.intersectPlane(plane,p);return p}function picked(e){const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(items.filter(a=>!a.dead).map(a=>a.g),true);if(!hit.length)return null;let obj=hit[0].object;while(obj.parent&&!items.some(a=>a.g===obj))obj=obj.parent;return items.find(a=>a.g===obj)||null}let autoBattle=false, autoTick=0, speedLevel=3, impactCooldown=0;
let soundOn=true,slowOn=false,effectsOn=true,audioCtx=null,shake=0,paused=false,orbitOn=false,orbitAngle=0;
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶️ 继续':'⏸ 暂停';};
$('orbit').onclick=()=>{orbitOn=!orbitOn;$('orbit').classList.toggle('active',orbitOn);};
$('undo').onclick=()=>{const a=[...items].reverse().find(o=>!o.dead);if(!a)return;disposeToy(a);updateCount();$('status').textContent='已撤销最近一个玩具';};
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 音效：开启':'🔇 音效：关闭';if(soundOn){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}}};
$('slow').onclick=()=>{slowOn=!slowOn;$('slow').classList.toggle('active',slowOn);$('slow').textContent=slowOn?'⏱ 慢动作：开启':'⏱ 慢动作：关闭'};
$('effects').onclick=()=>{effectsOn=!effectsOn;$('effects').textContent=effectsOn?'✨ 特效：开启':'✨ 特效：关闭'};
function hitSound(strength){if(!soundOn)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;osc.type='triangle';osc.frequency.setValueAtTime(Math.min(340,95+strength*14),now);osc.frequency.exponentialRampToValueAtTime(45,now+.14);gain.gain.setValueAtTime(Math.min(.12,.018+strength*.006),now);gain.gain.exponentialRampToValueAtTime(.001,now+.17);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.18)}catch(e){}}
const sparks=[];const sparkMat=new THREE.MeshBasicMaterial({color:'#ffca52'});
function burst(x,z,strength){if(!effectsOn)return;for(let i=0;i<Math.min(13,5+Math.floor(strength));i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.045+Math.random()*.05,6,4),sparkMat);m.position.set(x,.65,z);scene.add(m);const a=Math.random()*Math.PI*2,v=2+Math.random()*4;sparks.push({m,vx:Math.cos(a)*v,vz:Math.sin(a)*v,vy:2+Math.random()*3,life:.35+Math.random()*.25})}}
function updateSparks(dt){for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.life-=dt;p.m.position.x+=p.vx*dt;p.m.position.z+=p.vz*dt;p.m.position.y+=p.vy*dt;p.vy-=12*dt;p.m.scale.setScalar(Math.max(.1,p.life*2));if(p.life<=0){scene.remove(p.m);p.m.geometry.dispose();sparks.splice(i,1)}}}
const aimMat=new THREE.LineBasicMaterial({color:0x80ff8b,depthTest:false});const aimGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);const aimLine=new THREE.Line(aimGeo,aimMat);aimLine.visible=false;aimLine.renderOrder=20;scene.add(aimLine);function updateAim(start,end){aimGeo.setFromPoints([new THREE.Vector3(start.x,.75,start.z),new THREE.Vector3(end.x,.75,end.z)]);aimLine.visible=true;}let gesture=null;
renderer.domElement.addEventListener('pointerdown',e=>{e.preventDefault();const p=world(e);if(!p)return;const item=picked(e);gesture={item,start:p.clone(),last:p.clone(),moved:false};if(item&&tool==='grab'){item.body.type=CANNON.Body.KINEMATIC;item.body.velocity.setZero();item.body.angularVelocity.setZero();item.body.wakeUp()}renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!gesture)return;const p=world(e);if(!p)return;const d=p.clone().sub(gesture.last);if(p.distanceTo(gesture.start)>.15)gesture.moved=true;const a=gesture.item;if(a&&!a.dead){if(tool==='grab'){a.body.position.x=THREE.MathUtils.clamp(p.x,-8.5,8.5);a.body.position.z=THREE.MathUtils.clamp(p.z,-8.5,8.5);a.body.position.y=1.6}else if(tool==='rotate'){const q=new CANNON.Quaternion();q.setFromAxisAngle(new CANNON.Vec3(0,1,0),d.x*1.8+d.z*.7);a.body.quaternion=q.mult(a.body.quaternion);a.body.wakeUp()}}if(a&&(tool==='push'||tool==='launch'))updateAim(gesture.start,p);gesture.last.copy(p)});
renderer.domElement.addEventListener('pointerup',e=>{if(!gesture)return;aimLine.visible=false;const p=world(e)||gesture.last;const a=gesture.item,dx=p.x-gesture.start.x,dz=p.z-gesture.start.z;if(a&&!a.dead){if(tool==='grab'){a.body.type=CANNON.Body.DYNAMIC;a.body.updateMassProperties();a.body.wakeUp();if(gesture.moved){a.body.velocity.set(dx*1.3,0,dz*1.3)}}else if(tool==='push'||tool==='launch'){const scale=tool==='launch'?power*.16:7;const ix=dx*scale,iz=dz*scale;a.body.applyImpulse(new CANNON.Vec3(ix,tool==='launch'?Math.min(5,Math.hypot(ix,iz)*.14):.3,iz),new CANNON.Vec3(0,.6,0));a.body.wakeUp()}}else if(!gesture.moved&&Math.hypot(p.x,p.z)<7.7)spawn(p.x,p.z);gesture=null});
renderer.domElement.addEventListener('pointercancel',()=>{if(gesture?.item?.body){const b=gesture.item.body;b.type=CANNON.Body.DYNAMIC;b.updateMassProperties()}gesture=null;aimLine.visible=false});
function simulate(dt){if(matchActive&&!matchEnded){matchSeconds+=dt;refreshMatchHUD()}autoTick+=dt;const alive=items.filter(a=>!a.dead&&!a.falling);if(autoBattle&&autoTick>.4){autoTick=0;for(const a of alive){if(Math.random()>.76||a.body.type!==CANNON.Body.DYNAMIC)continue;let target=null,best=1e9;for(const b of alive){if(a===b)continue;const dx=b.body.position.x-a.body.position.x,dz=b.body.position.z-a.body.position.z,d=dx*dx+dz*dz;if(d<best){best=d;target=b}}if(target){const dx=target.body.position.x-a.body.position.x,dz=target.body.position.z-a.body.position.z,dist=Math.hypot(dx,dz)||1;const force=(.9+Math.random()*.8)*speedLevel*a.mass;a.body.applyImpulse(new CANNON.Vec3(dx/dist*force,.15,dz/dist*force),new CANNON.Vec3(0,.4,0));a.body.wakeUp()}}}
physics.step(1/60,dt,3);
for(const a of items){if(a.dead)continue;const b=a.body;a.g.position.set(b.position.x,b.position.y,b.position.z);a.g.quaternion.set(b.quaternion.x,b.quaternion.y,b.quaternion.z,b.quaternion.w);const v=b.velocity.length();for(const w of (a.visual.userData.wheels||[]))w.rotation.x+=v*dt*2;if(a.visual.userData.rotor)a.visual.userData.rotor.rotation.y+=dt*12;
const dist=Math.hypot(b.position.x,b.position.z);if(!a.falling&&mode==='battle'&&dist>8.18){a.falling=true;koCount++;b.linearDamping=.04;b.collisionFilterMask=0;b.wakeUp();updateCount();$('status').textContent='💥 玩具掉出竞技场！';const remaining=items.filter(v=>!v.dead&&!v.falling);if(remaining.length===1){const winner=defs.find(d=>d[2]===remaining[0].type)?.[1]||'玩具';$('status').textContent='🏆 冠军：'+winner;if(matchActive){matchEnded=true;matchActive=false;autoBattle=false;$('auto').classList.remove('active');$('auto').textContent='⚡ 自动混战：关闭';$('matchState').textContent='🏆 冠军：'+winner;$('tournament').classList.remove('active')}}}
if(mode==='sandbox'&&dist>7.7){const n=dist||1;b.position.x*=7.7/n;b.position.z*=7.7/n;b.velocity.x*=-.45;b.velocity.z*=-.45;b.wakeUp()}
if(a.falling&&b.position.y< -4)disposeToy(a);
}}
let setTimeoutCamera=false;let last=performance.now();function animate(t){requestAnimationFrame(animate);const rawDt=Math.min((t-last)/1000,.033);last=t;const dt=paused?0:rawDt*(slowOn?.28:1);if(dt>0){simulate(dt);updateSparks(dt);}if(orbitOn){orbitAngle+=rawDt*.22;camera.position.set(Math.sin(orbitAngle)*20,15,Math.cos(orbitAngle)*20);camera.lookAt(0,0,0);}if(shake>.002){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;shake*=.8;setTimeoutCamera=true}else if(setTimeoutCamera){if(!orbitOn)setCamera();setTimeoutCamera=false}renderer.render(scene,camera)}for(let i=0;i<4;i++){selected=i;selectedColor=colors[i];const a=i*Math.PI/2;spawn(Math.cos(a)*2.8,Math.sin(a)*2.8)}selected=0;selectedColor=colors[0];requestAnimationFrame(animate);$('loader').classList.add('hide');window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
