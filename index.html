function updateSparks(dt){for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.life-=dt;p.m.position.x+=p.vx*dt;p.m.position.z+=p.vz*dt;p.m.position.y+=p.vy*dt;p.vy-=12*dt;p.m.scale.setScalar(Math.max(.1,p.life*2));if(p.life<=0){scene.remove(p.m);p.m.geometry.dispose();sparks.splice(i,1)}}}
const aimMat=new THREE.LineBasicMaterial({color:0x80ff8b,depthTest:false});const aimGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);const aimLine=new THREE.Line(aimGeo,aimMat);aimLine.visible=false;aimLine.renderOrder=20;scene.add(aimLine);function updateAim(start,end){aimGeo.setFromPoints([new THREE.Vector3(start.x,.75,start.z),new THREE.Vector3(end.x,.75,end.z)]);aimLine.visible=true;}let gesture=null;renderer.domElement.addEventListener('pointerdown',e=>{e.preventDefault();const p=world(e);if(!p)return;const item=picked(e);gesture={item,start:p.clone(),last:p.clone(),time:performance.now(),moved:false};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!gesture)return;const p=world(e);if(!p)return;const d=p.clone().sub(gesture.last);if(p.distanceTo(gesture.start)>.15)gesture.moved=true;if(gesture.item&&!gesture.item.dead){const a=gesture.item;if(tool==='grab'){a.g.position.x=THREE.MathUtils.clamp(p.x,-9,9);a.g.position.z=THREE.MathUtils.clamp(p.z,-9,9);a.vx=0;a.vz=0}else if(tool==='rotate'){a.g.rotation.y+=d.x*1.8+d.z*.7}}if(gesture.item&&(tool==='push'||tool==='launch'))updateAim(gesture.start,p);gesture.last.copy(p)});renderer.domElement.addEventListener('pointerup',e=>{if(!gesture)return;aimLine.visible=false;const p=world(e)||gesture.last;const a=gesture.item,dx=p.x-gesture.start.x,dz=p.z-gesture.start.z;if(a){if(tool==='push'||tool==='launch'){const scale=tool==='launch'?power*.065:3.5;a.vx+=dx*scale;a.vz+=dz*scale;a.spin+=(Math.random()-.5)*2.5}else if(tool==='grab'&&gesture.moved){a.vx=dx*1.8;a.vz=dz*1.8}}else if(!gesture.moved&&Math.hypot(p.x,p.z)<7.7)spawn(p.x,p.z);gesture=null});renderer.domElement.addEventListener('pointercancel',()=>{gesture=null;aimLine.visible=false});
function simulate(dt){autoTick+=dt;impactCooldown=Math.max(0,impactCooldown-dt);const alive=items.filter(a=>!a.dead);if(autoBattle&&autoTick>.36){autoTick=0;for(const a of alive){if(Math.random()>.68)continue;let target=null,best=1e9;for(const b of alive){if(a===b)continue;const d=a.g.position.distanceToSquared(b.g.position);if(d<best){best=d;target=b}}if(target){const dx=target.g.position.x-a.g.position.x,dz=target.g.position.z-a.g.position.z,dist=Math.hypot(dx,dz)||1;const kick=(.65+Math.random()*.75)*speedLevel;a.vx+=dx/dist*kick;a.vz+=dz/dist*kick}else{a.vx+=(Math.random()-.5)*speedLevel;a.vz+=(Math.random()-.5)*speedLevel}}}for(const a of items){if(a.dead)continue;const grabbing=gesture?.item===a&&tool==='grab';if(!grabbing){a.g.position.x+=a.vx*dt;a.g.position.z+=a.vz*dt;a.vx*=Math.exp(-1.25*dt);a.vz*=Math.exp(-1.25*dt)}a.g.rotation.y+=a.spin*dt;a.spin*=Math.exp(-2*dt);const speed=Math.hypot(a.vx,a.vz);for(const w of (a.g.userData.wheels||[]))w.rotation.y+=speed*dt*2.2;a.tumbleX=(a.tumbleX||0)*Math.exp(-2.2*dt);a.tumbleZ=(a.tumbleZ||0)*Math.exp(-2.2*dt);a.g.rotation.z=THREE.MathUtils.lerp(a.g.rotation.z,THREE.MathUtils.clamp(-a.vx*.055+a.tumbleZ,-1.5,1.5),dt*5);a.g.rotation.x=THREE.MathUtils.lerp(a.g.rotation.x,THREE.MathUtils.clamp(a.vz*.055+a.tumbleX,-1.5,1.5),dt*5);if(mode==='battle'&&Math.hypot(a.g.position.x,a.g.position.z)>8.15){a.dead=true;scene.remove(a.g);updateCount();$('status').textContent='💥 一个玩具被撞出场！';const alive=items.filter(v=>!v.dead);if(alive.length===1)$('status').textContent='🏆 冠军：'+(defs.find(d=>d[2]===alive[0].type)?.[1]||'玩具')}else if(mode==='sandbox'&&Math.hypot(a.g.position.x,a.g.position.z)>7.7){const l=Math.hypot(a.g.position.x,a.g.position.z);a.g.position.x*=7.7/l;a.g.position.z*=7.7/l;a.vx*=-.55;a.vz*=-.55}}for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j];if(a.dead||b.dead)continue;let dx=b.g.position.x-a.g.position.x,dz=b.g.position.z-a.g.position.z,dist=Math.hypot(dx,dz)||.001,min=(a.radius+b.radius)*.85;if(dist>=min)continue;const nx=dx/dist,nz=dz/dist,overlap=(min-dist)*.5;a.g.position.x-=nx*overlap;a.g.position.z-=nz*overlap;b.g.position.x+=nx*overlap;b.g.position.z+=nz*overlap;const rel=(b.vx-a.vx)*nx+(b.vz-a.vz)*nz;if(rel<0){const impulse=-(1+.67)*rel/(1/a.mass+1/b.mass);a.vx-=impulse*nx/a.mass;a.vz-=impulse*nz/a.mass;b.vx+=impulse*nx/b.mass;b.vz+=impulse*nz/b.mass;a.spin+=(Math.random()-.5)*1.8;b.spin+=(Math.random()-.5)*1.8;const tumble=Math.min(2.4,Math.abs(impulse)*.065);a.tumbleX=(a.tumbleX||0)+(Math.random()-.5)*tumble;a.tumbleZ=(a.tumbleZ||0)+(Math.random()-.5)*tumble;b.tumbleX=(b.tumbleX||0)+(Math.random()-.5)*tumble;b.tumbleZ=(b.tumbleZ||0)+(Math.random()-.5)*tumble;if(impactCooldown===0&&Math.abs(impulse)>1.5){impactCooldown=.22;$('status').textContent='💥 碰撞！冲击强度 '+Math.round(Math.abs(impulse)*10);burst((a.g.position.x+b.g.position.x)/2,(a.g.position.z+b.g.position.z)/2,Math.abs(impulse));hitSound(Math.abs(impulse));shake=Math.min(.24,Math.abs(impulse)*.012)}}}}
let setTimeoutCamera=false;let last=performance.now();function animate(t){requestAnimationFrame(animate);const rawDt=Math.min((t-last)/1000,.033);last=t;const dt=paused?0:rawDt*(slowOn?.28:1);if(dt>0){simulate(dt);updateSparks(dt);}if(orbitOn){orbitAngle+=rawDt*.22;camera.position.set(Math.sin(orbitAngle)*20,15,Math.cos(orbitAngle)*20);camera.lookAt(0,0,0);}if(shake>.002){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;shake*=.8;setTimeoutCamera=true}else if(setTimeoutCamera){setCamera();setTimeoutCamera=false}renderer.render(scene,camera)}for(let i=0;i<4;i++){selected=i;selectedColor=colors[i];const a=i*Math.PI/2;spawn(Math.cos(a)*2.8,Math.sin(a)*2.8)}selected=0;selectedColor=colors[0];requestAnimationFrame(animate);$('loader').classList.add('hide');window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
